# Custom Azahar (2126.2 + SVC 0x70 + LayeredFS preload + SD845 defaults) — cloud build.
#
# Runs on a PRISTINE fork of azahar-emu/azahar. The checkout is PINNED to
# commit 219d743 (Azahar 2126.2, the build the patch was cut against): a fork
# copies upstream's moving master, which drifts and breaks patch context. One extra file must sit at the repo
# root: combined.patch (the four custom changes in one file). The first build step
# applies it; everything after that mirrors Azahar's own CI Android job
# (.github/workflows/build.yml "android" + .ci/android.sh) with three deltas:
# APK only (no Play bundle), the tree's pinned NDK installed explicitly, and
# ccache wired the same way their CI wires it.
#
# HOW TO RUN: Actions -> "Build Custom Azahar" -> Run workflow. The APK lands as
# the "azahar-custom-android" artifact on the run. No secrets needed: with no
# keystore configured, the tree's own release config falls back to debug signing
# (expected — the APK installs after uninstalling stock Azahar; the external
# "Azahare 2" data folder is untouched by the swap).

name: Build Custom Azahar

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: vanilla
    steps:
      # Check out the 2126.2 TAG (== commit 219d743, the source of the user's
      # installed build). A tag checkout is the standard release path; the
      # earlier raw-SHA pin died in this step. combined.patch is not in the
      # tag tree, so it is fetched from this fork's master, where it lives.
      - uses: actions/checkout@v6
        with:
          ref: 2126.2
          submodules: recursive

      - name: Fetch combined.patch from master
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/master/combined.patch" -o combined.patch
          ls -l combined.patch

      - name: Apply combined.patch
        run: |
          set -e
          git apply --check combined.patch
          git apply -v combined.patch
          echo "combined.patch applied cleanly:"
          git status --porcelain

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-vanilla-custom-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-vanilla-custom-

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y

      - name: Install pinned Android SDK components
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724"
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

      - name: Build (APK only; .ci/android.sh also bundles for Play — skipped)
        run: |
          export NDK_CCACHE=$(which ccache)
          cd src/android
          chmod +x ./gradlew
          ./gradlew assembleVanillaRelease
          ccache -s -v

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: azahar-custom-android
          path: src/android/app/build/outputs/apk/vanilla/release/*.apk
